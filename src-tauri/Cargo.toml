[package]
name = "gomoku-game"
version = "1.0.2"
description = "A modern Gomoku (Five in a Row) desktop game built with Tauri 2 + React + Rust"
authors = ["MrShenhongbo"]
license = "MIT"
repository = "https://github.com/MrShenhongbo/gomoku-game"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gomoku_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["sync"] }
chrono = "0.4"
lazy_static = "1.4"
